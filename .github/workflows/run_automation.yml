name: Nightly Nuvio Library Sync

on:
  schedule:
    # Runs automatically every single night at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to also trigger it manually with a single click

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Run Automation Engine Script
      run: python automate.py

    - name: Commit and Push Automated JSON File Changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Engine"
        git add nuvio_config.json nuvio_config_automated.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automated Sync Cycle: $(date +'%Y-%m-%d')" && git push)
